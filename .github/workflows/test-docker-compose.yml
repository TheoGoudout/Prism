name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          DOMAIN=localhost
          FRONTEND_HOST=http://localhost:5173
          ENVIRONMENT=local
          PROJECT_NAME=Prism
          STACK_NAME=prism
          BACKEND_CORS_ORIGINS=http://localhost,http://localhost:5173
          API_BASE_URL=http://localhost:8000
          REDIS_URL=redis://redis:6379/0
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          EMAILS_FROM_EMAIL=info@example.com
          SMTP_TLS=True
          SMTP_SSL=False
          SMTP_PORT=587
          DOCKER_IMAGE_BACKEND=prism/backend
          DOCKER_IMAGE_FRONTEND=prism/frontend
          AI_PROVIDER=openai
          AI_MODEL=gpt-4o-mini
          LANGCHAIN_TRACING_V2=false
          EOF
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}" >> .env
          echo "FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env

      - name: Create frontend/.env
        run: |
          cat > frontend/.env << 'EOF'
          VITE_API_URL=http://localhost:8000
          MAILCATCHER_HOST=http://localhost:1080
          EOF

      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
